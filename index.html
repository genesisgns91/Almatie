<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Almatiê Art — Artes digitais para sublimação</title>
  <meta name="description" content="Artes prontas para sublimar em canecas, camisetas, DTF e muito mais. Pagou no Pix, a arte é liberada na hora.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Só diretivas que não interferem no funcionamento: bloqueia plugins, troca de <base> e envio de formulários para fora -->
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Almatiê Art">
  <meta property="og:title" content="Almatiê Art — Artes digitais para sublimação">
  <meta property="og:description" content="Artes prontas para sublimar. Pagou no Pix, a arte é liberada na hora.">
  <meta property="og:image" content="https://genesisgns91.github.io/Almatie/icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- O favicon do navegador continua 100% dinâmico (escolhido pelo admin na loja) -->
  <link id="dynamicFavicon" rel="icon" type="image/x-icon" href="">

  <!-- PWA: instalabilidade no celular -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FBF8F4">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Almatiê Art">
  <!-- Ícone do app (tela inicial do celular). Diferente do favicon do navegador,
       que continua escolhido pelo admin — este é fixo, definido pela marca. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">


</head>
<body>

  <!-- LOADER DE CARREGAMENTO — aparece assim que a página abre (no navegador
       ou como app instalado) e some sozinho quando os dados da loja
       (produtos, categorias, identidade visual) terminam de carregar. -->
  <div id="pageLoader" class="page-loader" role="status" aria-live="polite" aria-label="Carregando a loja">
    <div class="page-loader-conteudo">
      <div class="page-loader-marca">
        <span class="page-loader-anel"></span>
        <img src="splash-logo.png" alt="" class="page-loader-logo">
      </div>
      <p class="page-loader-texto">.<span class="page-loader-pontos"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
  </div>

  <div id="headerBanner" class="header-banner escondido">
    <img id="headerBannerImg" src="" alt="Banner da Almatiê Art">
  </div>

  <header class="site-header">
    <div class="brand-container">
      <img id="siteLogo" class="logo-img escondido" src="" alt="Logo da Almatiê Art">
      <div class="brand">
        <h1>Almatiê Art</h1>
        <span>Artes digitais para sublimação</span>
      </div>
    </div>
    <button id="btnLogin" class="btn-engrenagem" title="Área administrativa" aria-label="Área administrativa" aria-haspopup="dialog">⚙️</button>
  </header>

  <div id="modalOverlay" class="modal-overlay escondido"></div>

  <div id="boxLogin" class="modal-login escondido" role="dialog" aria-modal="true" aria-labelledby="tituloLogin">
    <div class="modal-login-header">
      <h3 id="tituloLogin">Acesso Restrito</h3>
      <button type="button" id="btnFecharModal" class="btn-fechar-modal" aria-label="Fechar">✕</button>
    </div>
    <form id="formLogin" novalidate>
      <div class="form-group">
        <label for="emailInput">E-mail do Admin:</label>
        <input type="email" id="emailInput" placeholder="admin@email.com" autocomplete="username" inputmode="email" required>
      </div>
      <div class="form-group">
        <label for="senhaInput">Senha:</label>
        <input type="password" id="senhaInput" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btnFazerLogin" class="btn btn-primary">Entrar</button>
      <div id="msgErro" class="status-msg" role="alert" style="color: var(--danger);"></div>
    </form>
  </div>

  <!-- O painel de gestão é entregue pelo Worker somente ao admin logado -->
  <div id="painelAdminMontagem"></div>

  <section class="hero-loja sf-hero">
    <div class="hero-texto">
      <h2>Artes prontas para sublimar</h2>
      <p>Estampas exclusivas para canecas, camisetas, DTF e muito mais. Pagou no Pix, a arte é liberada na hora.</p>
    </div>
    <nav class="hero-atalhos" aria-label="Links da loja">
      <a class="hero-atalho" href="https://genesisgns91.github.io/Mockup/" target="_blank" rel="noopener" title="Mockup" aria-label="Abrir o site de Mockup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h11v7.5a4.5 4.5 0 0 1-4.5 4.5h-2a4.5 4.5 0 0 1-4.5-4.5V7z"/><path d="M15.5 9h1.5a2.5 2.5 0 0 1 0 5h-1.5"/><path d="M3 21h14"/></svg>
        <span>mockup</span>
      </a>
      <!-- TROQUE o endereço abaixo pelo link do seu Instagram -->
      <a class="hero-atalho" href="https://www.instagram.com/" target="_blank" rel="noopener" title="Instagram" aria-label="Abrir o Instagram da loja">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor"/></svg>
      </a>
    </nav>
  </section>

  <div class="area-filtros sf-area">
    <div class="sf-barra" id="barraFiltros">
      <button type="button" id="btnFiltros" class="sf-btn-filtros" aria-expanded="false" aria-controls="painelFiltros" aria-haspopup="dialog">
        <span class="sf-sanduiche" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Filtros</span>
        <span id="filtrosBadge" class="sf-badge escondido" aria-hidden="true">0</span>
      </button>
      <div class="sf-busca" id="blocoBusca" role="search">
        <svg class="sf-busca-icone" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="campoBusca" class="sf-campo" placeholder="Buscar artes" autocomplete="off" enterkeyhint="search" aria-label="Buscar artes">
        <button type="button" id="btnLimparBusca" class="sf-busca-limpar" aria-label="Limpar busca" tabindex="-1">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
    <div id="filtrosAtivos" class="sf-ativos" aria-label="Filtros ativos"></div>
  </div>

  <section id="secaoDestaques" class="secao-destaques escondido" aria-label="Anúncios em destaque">
    <div class="destaques-cabecalho">
      <h2>⭐ Em destaque</h2>
      <div class="destaques-nav">
        <button type="button" id="destaquesPrev" aria-label="Anterior">❮</button>
        <button type="button" id="destaquesNext" aria-label="Próximo">❯</button>
      </div>
    </div>
    <div class="destaques-trilho" id="destaquesTrilho"></div>
  </section>

  <div class="vitrine-cabecalho">
    <h2 id="tituloVitrine">Todas as artes</h2>
    <span id="contadorResultados" class="contador-resultados"></span>
    <button type="button" id="btnLimparFiltros" class="btn-link escondido">Limpar filtros</button>
  </div>

  <div class="vitrine" id="vitrineProdutos"></div>

  <div class="area-filtros sf-area">
    <nav id="paginacao" class="sf-pag escondido" aria-label="Paginação das artes"></nav>
  </div>

  <div id="filtrosOverlay" class="sf-overlay"></div>
  <aside id="painelFiltros" class="sf-painel" role="dialog" aria-modal="true" aria-labelledby="filtrosTitulo">
    <div class="sf-painel-topo">
      <h2 id="filtrosTitulo">Filtrar artes</h2>
      <button type="button" id="btnFecharFiltros" class="sf-icone-btn" aria-label="Fechar filtros">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="containerFiltros" class="sf-painel-corpo"></div>
    <div class="sf-painel-rodape">
      <button type="button" id="btnLimparPainel" class="sf-btn sf-btn-sec">Limpar</button>
      <button type="button" id="btnAplicarFiltros" class="sf-btn sf-btn-pri">Ver artes</button>
    </div>
  </aside>

  <!-- Barra de navegação do app (só aparece no celular) -->
  <nav id="appNav" class="app-nav" aria-label="Navegação principal">
    <button type="button" class="app-nav-item ativo" data-nav="inicio" aria-current="page">
      <span class="app-nav-icone"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></span>
      <span>Início</span>
    </button>
    <button type="button" class="app-nav-item" data-nav="buscar">
      <span class="app-nav-icone"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <span>Buscar</span>
    </button>
    <button type="button" class="app-nav-item" data-nav="filtros">
      <span class="app-nav-icone">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></svg>
        <span id="navFiltrosBadge" class="app-nav-badge escondido" aria-hidden="true">0</span>
      </span>
      <span>Filtros</span>
    </button>
  </nav>

  <div id="modalGaleria" class="modal-galeria-overlay escondido" role="dialog" aria-modal="true" aria-labelledby="galeriaTitulo">
    <div class="modal-galeria-container">
      <button id="btnFecharGaleria" class="btn-fechar-galeria" title="Fechar (Esc)" aria-label="Fechar">✕</button>

      <div class="galeria-carrossel-wrap">
        <div class="galeria-carrossel" id="galeriaCarrosselImgs"></div>
        <button class="btn-nav-galeria btn-prev-galeria" id="btnPrevGaleria" aria-label="Imagem anterior">❮</button>
        <button class="btn-nav-galeria btn-next-galeria" id="btnNextGaleria" aria-label="Próxima imagem">❯</button>
        <span class="galeria-contador" id="galeriaContador"></span>
        <button type="button" class="btn-leitura-galeria" id="btnLeituraGaleria" aria-pressed="false">⤢ Ampliar texto</button>
      </div>

      <aside class="galeria-miniaturas" id="galeriaMiniaturas" aria-label="Todas as imagens do anúncio">
        <div class="galeria-miniaturas-topo"><strong>Todas as imagens</strong><span id="galeriaTotal"></span></div>
        <div class="galeria-miniaturas-grade" id="galeriaGradeMini"></div>
      </aside>

      <div class="galeria-info">
        <div class="galeria-texto">
          <h2 id="galeriaTitulo" class="galeria-titulo"></h2>
          <div class="galeria-meta card-meta" id="galeriaMeta"></div>
          <div class="galeria-descricao" id="galeriaDescricao"></div>
          <div class="galeria-tags escondido" id="galeriaTags"></div>
        </div>
        <div class="galeria-acao">
          <div class="galeria-preco-box">
            <span class="preco-label" id="galeriaPrecoLabel">Valor</span>
            <div class="card-preco"><small>R$</small> <span id="galeriaPrecoValor">0,00</span></div>
            <span class="preco-validade escondido" id="galeriaValidade"></span>
            <span id="galeriaPixWrap"></span>
          </div>
          <button type="button" id="galeriaBtnComprar" class="btn-comprar btn-comprar-galeria">Comprar Arte</button>
          <button type="button" id="galeriaBtnCompartilhar" class="btn-compartilhar btn-compartilhar-galeria" aria-label="Compartilhar esta arte" title="Compartilhar"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.8 7.4-4.4M8.3 13.2l7.4 4.4"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./loja.js"></script>
  <script type="module" src="./pix-checkout.js"></script>

</body>
</html>

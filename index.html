<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio & Loja de Artes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <h1>Minha Galeria</h1>
    <button id="open-login-btn">Área do ADM</button>
  </header>

  <!-- VITRINE PÚBLICA -->
  <main class="container">
    <section class="filters">
      <input type="text" id="search-input" placeholder="Buscar por título ou descrição...">
      <select id="category-filter">
        <option value="all">Todas as Categorias</option>
      </select>
    </section>

    <div id="catalog-grid" class="grid">
      <!-- Os cards serão inseridos aqui via script -->
    </div>
  </main>

  <!-- MODAL DE DETALHES / CARROSSEL (PÚBLICO) -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="close-detail-modal">&times;</span>
      <div class="carousel-container">
        <button id="prev-img-btn" class="carousel-nav">&lt;</button>
        <div id="carousel-media-display"></div>
        <button id="next-img-btn" class="carousel-nav">&gt;</button>
      </div>
      <div class="carousel-dots" id="carousel-dots"></div>
      
      <h2 id="modal-title"></h2>
      <p id="modal-category" class="badge"></p>
      <p id="modal-description"></p>
      <div class="price-tag" id="modal-price"></div>
      
      <a id="modal-buy-link" href="#" target="_blank" class="buy-btn">Comprar Agora</a>
    </div>
  </div>

  <!-- MODAL DE LOGIN (ADM) -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-content small">
      <span class="close-btn" id="close-login-modal">&times;</span>
      <h2>Login do Administrador</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="E-mail" required>
        <input type="password" id="login-pass" placeholder="Senha" required>
        <button type="submit" class="primary-btn">Entrar</button>
      </form>
    </div>
  </div>

  <!-- PAINEL ADMINISTRATIVO (SÓ APARECE SE ESTIVER AUTENTICADO) -->
  <section id="admin-panel" class="container hidden">
    <div class="admin-header">
      <h2>Painel Administrativo</h2>
      <button id="logout-btn" class="danger-btn">Sair</button>
    </div>

    <form id="product-form" class="admin-form">
      <h3>Cadastrar / Editar Item</h3>
      <input type="hidden" id="item-id">
      
      <input type="text" id="item-title" placeholder="Título do Pacote" required>
      <textarea id="item-description" placeholder="Descrição detalhada..." rows="3" required></textarea>
      
      <div class="form-row">
        <input type="number" step="0.01" id="item-price" placeholder="Preço (R$)" required>
        <input type="text" id="item-category" placeholder="Categoria/Tag (ex: Ilustração, Ebook)" required>
      </div>

      <input type="url" id="item-buylink" placeholder="Link de Pagamento (ex: Mercado Pago, Hotmart)" required>
      
      <label>Fotos para o Carrossel (PNG, JPG, WebP):</label>
      <input type="file" id="item-images" multiple accept="image/*">

      <label>Arquivos Adicionais para Venda (PDF, Excel, ZIP):</label>
      <input type="file" id="item-files" multiple accept=".pdf,.xlsx,.xls,.zip,.rar">

      <div class="form-actions">
        <button type="submit" class="primary-btn" id="save-btn">Salvar Pacote</button>
        <button type="button" id="cancel-edit-btn" class="secondary-btn hidden">Cancelar Edição</button>
      </div>
    </form>
  </section>

  <!-- LÓGICA DE JAVASCRIPT EMBUTIDA QUE CONSUMO O FIREBASE DE OUTRO ARQUIVO -->
  <script type="module">
    import { auth, db, storage } from './firebase-config.js';
    import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Estado da Aplicação
    let itemsList = [];
    let currentUser = null;
    let currentCarouselImages = [];
    let currentCarouselIndex = 0;

    // Referências do DOM
    const catalogGrid = document.getElementById("catalog-grid");
    const searchInput = document.getElementById("search-input");
    const categoryFilter = document.getElementById("category-filter");
    const adminPanel = document.getElementById("admin-panel");
    const productForm = document.getElementById("product-form");

    // AUTHENTICATION (LOGIN & LOGOUT)
    document.getElementById("open-login-btn").addEventListener("click", () => {
      if (currentUser) {
        adminPanel.scrollIntoView({ behavior: 'smooth' });
      } else {
        document.getElementById("login-modal").classList.remove("hidden");
      }
    });

    document.getElementById("close-login-modal").addEventListener("click", () => {
      document.getElementById("login-modal").classList.add("hidden");
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const pass = document.getElementById("login-pass").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        document.getElementById("login-modal").classList.add("hidden");
      } catch (err) {
        alert("Erro ao realizar login: " + err.message);
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        adminPanel.classList.remove("hidden");
        document.getElementById("open-login-btn").innerText = "Ir para o Painel ADM";
      } else {
        adminPanel.classList.add("hidden");
        document.getElementById("open-login-btn").innerText = "Área do ADM";
      }
      renderCatalog();
    });

    // BUSCAR ITENS NO FIRESTORE
    async function fetchItems() {
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        itemsList = [];
        querySnapshot.forEach((doc) => {
          itemsList.push({ id: doc.id, ...doc.data() });
        });
        updateCategoryDropdown();
        renderCatalog();
      } catch (err) {
        console.error("Erro ao carregar catálogo:", err);
      }
    }

    function updateCategoryDropdown() {
      const categories = [...new Set(itemsList.map(item => item.category))];
      categoryFilter.innerHTML = '<option value="all">Todas as Categorias</option>';
      categories.forEach(cat => {
        if (cat) categoryFilter.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    // EXIBIR O CATÁLOGO
    function renderCatalog() {
      const search = searchInput.value.toLowerCase();
      const selectedCategory = categoryFilter.value;

      const filtered = itemsList.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(search) || item.description.toLowerCase().includes(search);
        const matchesCategory = selectedCategory === "all" || item.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      catalogGrid.innerHTML = "";
      filtered.forEach(item => {
        const thumb = item.images && item.images.length > 0 ? item.images[0] : "https://via.placeholder.com/300";
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${thumb}" class="card-thumb" alt="${item.title}">
          <div class="card-body">
            <span class="badge">${item.category}</span>
            <h3>${item.title}</h3>
            <p class="card-price">R$ ${parseFloat(item.price).toFixed(2)}</p>
            ${currentUser ? `
              <div class="admin-actions">
                <button class="secondary-btn edit-btn" data-id="${item.id}">Editar</button>
                <button class="danger-btn delete-btn" data-id="${item.id}">Excluir</button>
              </div>
            ` : ''}
          </div>
        `;

        card.addEventListener("click", (e) => {
          if (!e.target.classList.contains("edit-btn") && !e.target.classList.contains("delete-btn")) {
            openDetailModal(item);
          }
        });

        catalogGrid.appendChild(card);
      });

      // Botoes de Ação ADM nos cards
      if (currentUser) {
        document.querySelectorAll(".edit-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            setupEdit(btn.dataset.id);
          });
        });
        document.querySelectorAll(".delete-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteItem(btn.dataset.id);
          });
        });
      }
    }

    // FILTROS DE PESQUISA
    searchInput.addEventListener("input", renderCatalog);
    categoryFilter.addEventListener("change", renderCatalog);

    // MODAL DE DETALHES E CARROSSEL
    function openDetailModal(item) {
      currentCarouselImages = item.images || [];
      currentCarouselIndex = 0;

      document.getElementById("modal-title").innerText = item.title;
      document.getElementById("modal-category").innerText = item.category;
      document.getElementById("modal-description").innerText = item.description;
      document.getElementById("modal-price").innerText = `R$ ${parseFloat(item.price).toFixed(2)}`;
      document.getElementById("modal-buy-link").href = item.buyLink;

      updateCarouselDisplay();
      document.getElementById("detail-modal").classList.remove("hidden");
    }

    function updateCarouselDisplay() {
      const display = document.getElementById("carousel-media-display");
      const dotsContainer = document.getElementById("carousel-dots");
      
      if (currentCarouselImages.length === 0) {
        display.innerHTML = "<p style='color:white;'>Sem imagens</p>";
        dotsContainer.innerHTML = "";
        return;
      }

      display.innerHTML = `<img src="${currentCarouselImages[currentCarouselIndex]}" />`;
      
      dotsContainer.innerHTML = currentCarouselImages.map((_, idx) => 
        `<span class="dot ${idx === currentCarouselIndex ? 'active' : ''}"></span>`
      ).join("");
    }

    document.getElementById("prev-img-btn").addEventListener("click", () => {
      if (currentCarouselImages.length === 0) return;
      currentCarouselIndex = (currentCarouselIndex - 1 + currentCarouselImages.length) % currentCarouselImages.length;
      updateCarouselDisplay();
    });

    document.getElementById("next-img-btn").addEventListener("click", () => {
      if (currentCarouselImages.length === 0) return;
      currentCarouselIndex = (currentCarouselIndex + 1) % currentCarouselImages.length;
      updateCarouselDisplay();
    });

    document.getElementById("close-detail-modal").addEventListener("click", () => {
      document.getElementById("detail-modal").classList.add("hidden");
    });

    // UPLOAD E CADASTRO (PAINEL ADM)
    productForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("item-id").value;
      const title = document.getElementById("item-title").value;
      const description = document.getElementById("item-description").value;
      const price = document.getElementById("item-price").value;
      const category = document.getElementById("item-category").value;
      const buyLink = document.getElementById("item-buylink").value;
      
      const imageFiles = document.getElementById("item-images").files;
      const fileFiles = document.getElementById("item-files").files;

      const submitBtn = document.getElementById("save-btn");
      submitBtn.innerText = "Salvando...";
      submitBtn.disabled = true;

      try {
        let imageUrls = [];
        let attachmentUrls = [];

        if (id) {
          const existing = itemsList.find(i => i.id === id);
          imageUrls = existing.images || [];
          attachmentUrls = existing.attachments || [];
        }

        // Upload de Imagens para o Firebase Storage
        for (let file of imageFiles) {
          const storageRef = ref(storage, `images/${Date.now()}_${file.name}`);
          await uploadBytes(storageRef, file);
          const url = await getDownloadURL(storageRef);
          imageUrls.push(url);
        }

        // Upload de Documentos para o Firebase Storage
        for (let file of fileFiles) {
          const storageRef = ref(storage, `documents/${Date.now()}_${file.name}`);
          await uploadBytes(storageRef, file);
          const url = await getDownloadURL(storageRef);
          attachmentUrls.push({ name: file.name, url: url });
        }

        const payload = { title, description, price, category, buyLink, images: imageUrls, attachments: attachmentUrls, updatedAt: new Date() };

        if (id) {
          await updateDoc(doc(db, "products", id), payload);
        } else {
          await addDoc(collection(db, "products"), payload);
        }

        productForm.reset();
        document.getElementById("item-id").value = "";
        document.getElementById("cancel-edit-btn").classList.add("hidden");
        fetchItems();
      } catch (err) {
        alert("Erro ao salvar o pacote: " + err.message);
      } finally {
        submitBtn.innerText = "Salvar Pacote";
        submitBtn.disabled = false;
      }
    });

    function setupEdit(id) {
      const item = itemsList.find(i => i.id === id);
      if (!item) return;

      document.getElementById("item-id").value = item.id;
      document.getElementById("item-title").value = item.title;
      document.getElementById("item-description").value = item.description;
      document.getElementById("item-price").value = item.price;
      document.getElementById("item-category").value = item.category;
      document.getElementById("item-buylink").value = item.buyLink;

      document.getElementById("cancel-edit-btn").classList.remove("hidden");
      adminPanel.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById("cancel-edit-btn").addEventListener("click", () => {
      productForm.reset();
      document.getElementById("item-id").value = "";
      document.getElementById("cancel-edit-btn").classList.add("hidden");
    });

    async function deleteItem(id) {
      if (confirm("Tem certeza que deseja excluir este pacote?")) {
        await deleteDoc(doc(db, "products", id));
        fetchItems();
      }
    }

    // Inicialização
    fetchItems();
  </script>
</body>
</html>
